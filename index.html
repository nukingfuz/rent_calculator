<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rent Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="bg-green-50 font-sans text-gray-900 p-6">

  <!-- Title Bubble with Emoji -->
  <div class="bg-green-600 text-white text-3xl font-semibold rounded-full py-4 text-center mb-6" style="font-size: 1.5rem;">
    Angerella's Rent Calculator 💸
  </div>

  <div class="max-w-md mx-auto bg-white rounded-lg shadow-xl p-6 space-y-4">
    <!-- Base Rent Input -->
    <label class="block text-lg text-gray-800 mb-2">Base Rent ($/month):</label>
    <input id="baseRent" type="text" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-300" oninput="formatNumber(this)" />

    <!-- Lease Term Input -->
    <label class="block text-lg text-gray-800 mb-2">Lease Term (months):</label>
    <input id="leaseTerm" type="text" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-300" oninput="formatNumber(this)" />

    <!-- Promotion Amount and Unit Input -->
    <label class="block text-lg text-gray-800 mb-2">Promotion Amount:</label>
    <div class="flex space-x-2 mb-4">
      <input id="promoValue" type="text" class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-300" oninput="formatNumber(this)" />
      <select id="promoUnit" class="p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-300">
        <option value="weeks">Weeks</option>
        <option value="months">Months</option>
      </select>
    </div>

    <!-- Calculate Button -->
    <button onclick="calculate()" class="w-full bg-green-500 text-white p-3 rounded-lg hover:bg-green-600 transition">Calculate Final Rent</button>

    <!-- Result Display -->
    <div id="result" class="mt-6 text-center">
      <!-- Result will be displayed here -->
    </div>
  </div>

  <script>
    // Function to format the number with commas as the user types
    function formatNumber(input) {
      let value = input.value.replace(/[^0-9.]/g, ''); // Remove non-numeric characters
      if (value) {
        value = Number(value).toLocaleString(); // Add commas
      }
      input.value = value;
    }

    // Function to add commas to a number
    function addCommas(number) {
      return number.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function calculate() {
      const baseRent = parseFloat(document.getElementById('baseRent').value.replace(/[^0-9.-]+/g, "")); // Remove commas
      const leaseTerm = parseFloat(document.getElementById('leaseTerm').value.replace(/[^0-9.-]+/g, ""));
      const promoValue = parseFloat(document.getElementById('promoValue').value.replace(/[^0-9.-]+/g, "")) || 0;
      const promoUnit = document.getElementById('promoUnit').value;

      if (isNaN(baseRent) || isNaN(leaseTerm) || leaseTerm <= 0) {
        document.getElementById('result').innerHTML = "Please enter valid numbers.";
        return;
      }

      const totalCost = baseRent * leaseTerm;

      // More precise: average days in a month (365 days per year / 12 months)
      const daysPerMonth = 365.25 / 12;  // 30.41667 days per month
      const weeksPerMonth = daysPerMonth / 7;  // 4.3452 weeks per month

      const weeklyRent = baseRent / weeksPerMonth;
      
      let discount = 0;

      if (promoUnit === "weeks") {
        discount = weeklyRent * promoValue;
      } else if (promoUnit === "months") {
        discount = baseRent * promoValue;
      }

      const discountedCost = totalCost - discount;
      const effectiveRent = discountedCost / leaseTerm;

      // Format the result with commas using the addCommas function
      const formattedRent = addCommas(effectiveRent.toFixed(2));

      document.getElementById('result').innerHTML = `
        <div class="bg-green-100 p-4 rounded-lg shadow-md">
          <p class="text-xl font-semibold text-green-600 mb-2">Effective Rent After Promotion:</p>
          <p class="text-3xl font-bold text-green-700">$${formattedRent}</p>
          <p class="text-lg font-bold text-green-600">per month</p>
        </div>
      `;
    }
  </script>

</body>
</html>
